name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run ci
      - name: Package TUI
        run: bash scripts/package-tui.sh
      - name: Smoke test binary
        run: |
          ./dist/yt-dlp-tui-linux-x64 --version
          ./dist/yt-dlp-tui-linux-x64 --help
