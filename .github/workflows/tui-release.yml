name: TUI Release

on:
  workflow_dispatch:

jobs:
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI
        run: bun run ci

      - name: Package Linux binaries
        run: bash scripts/package-tui.sh

      - name: Install arm64 emulation
        run: sudo apt-get update && sudo apt-get install -y qemu-user-static

      - name: Test x64 binary
        run: ./dist/yt-dlp-tui-linux-x64 --version

      - name: Test arm64 binary
        run: qemu-aarch64-static ./dist/yt-dlp-tui-linux-arm64 --version

      - name: Write checksums
        run: sha256sum dist/yt-dlp-tui-linux-x64 dist/yt-dlp-tui-linux-arm64 > dist/yt-dlp-tui-checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-tui-linux
          path: |
            dist/yt-dlp-tui-linux-x64
            dist/yt-dlp-tui-linux-arm64
            dist/yt-dlp-tui-checksums.txt
